<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Alternativa Energetika</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6a4a'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Segoe UI,sans-serif' font-size='13' font-weight='700' fill='white'%3EAE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var savedTheme = localStorage.getItem("ae-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
      var savedLang = localStorage.getItem("ae-lang");
      if (savedLang === "en" || savedLang === "lv") {
        document.documentElement.lang = savedLang;
      }
    } catch (error) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>This app needs JavaScript. It does not need an internet connection. Lietotnei vajag JavaScript. Internets nav vajadzīgs.</noscript>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
